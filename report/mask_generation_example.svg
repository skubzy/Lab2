  </defs>

  <rect width="1100" height="520" fill="#eef4f8"/>
  <text x="60" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#102a43">Example Image and Rasterized Mask</text>

  <rect x="52" y="86" width="462" height="380" rx="14" fill="url(#sky)" stroke="#9fb3c8" stroke-width="2"/>
  <rect x="560" y="86" width="488" height="380" rx="14" fill="#1f2933" stroke="#9fb3c8" stroke-width="2"/>

  <g transform="translate(52 86)">
