    <rect x="0" y="285" width="462" height="18" fill="#8c7a67" opacity="0.85"/>
    <rect x="50" y="84" width="112" height="88" fill="#f7efe4" stroke="#7b8794" stroke-width="2"/>
    <polygon points="40,92 106,42 173,92" fill="url(#roof)" stroke="#8e3e33" stroke-width="3"/>
    <rect x="88" y="120" width="26" height="52" fill="#96c3e8"/>
    <rect x="122" y="122" width="24" height="22" fill="#96c3e8"/>

    <rect x="215" y="118" width="126" height="94" fill="#f4ead7" stroke="#7b8794" stroke-width="2"/>
