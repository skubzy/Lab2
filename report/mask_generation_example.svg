<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#b9d8f2"/>
      <stop offset="100%" stop-color="#7cb1d8"/>
    </linearGradient>
    <pattern id="roof" width="14" height="14" patternUnits="userSpaceOnUse">
