    <rect x="205" y="100" width="138" height="100" fill="#ffffff"/>
    <polygon points="194,110 274,48 354,110" fill="#ffffff"/>
    <rect x="314" y="227" width="106" height="78" fill="#ffffff"/>
    <polygon points="304,235 367,188 430,235" fill="#ffffff"/>
