    <rect x="244" y="152" width="30" height="60" fill="#96c3e8"/>
    <rect x="288" y="150" width="28" height="28" fill="#96c3e8"/>
    <rect x="372" y="176" width="46" height="32" fill="#d4dce6" stroke="#6b7c93" stroke-width="2"/>

    <rect x="324" y="236" width="95" height="72" fill="#efe6d8" stroke="#7b8794" stroke-width="2"/>
    <polygon points="316,244 372,202 429,244" fill="url(#roof)" stroke="#8e3e33" stroke-width="3"/>
    <rect x="356" y="266" width="24" height="42" fill="#96c3e8"/>

