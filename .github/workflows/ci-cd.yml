name: ci-cd

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest

      - name: Build Docker image
        run: docker build -t ${{ github.repository }}:${{ github.sha }} .

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        run: |
          docker tag ${{ github.repository }}:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/lab2-house-segmentation:${{ github.sha }}
          docker tag ${{ github.repository }}:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/lab2-house-segmentation:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/lab2-house-segmentation:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/lab2-house-segmentation:latest

